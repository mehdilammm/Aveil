# Signs a new agentscope-core release with the offline Ed25519 key. The key (PLUGIN_SIGNING_KEY) is a secret of the
# GitHub Environment "release", which only main may use (Environment > Deployment branches: main), and this job
# also refuses any other ref, so a branch cannot run its own copy of the signing script with the key.
# Runs when lib/plugin-release.json or the zips change on main, and on demand (from main only). The signature is
# committed back; the app serves it at /api/plugin/latest and the plugin (1.9.0+) installs only signed releases.
name: Sign plugin release
on:
  push:
    branches: [main]
    paths: ["lib/plugin-release.json", "public/downloads/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sign-plugin
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/sign-plugin.mjs
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
      - name: Commit the signature
        run: |
          if git diff --quiet lib/plugin-release.json; then echo "nothing to sign"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sign plugin release $(node -p "require('./lib/plugin-release.json').file")" lib/plugin-release.json
          git push origin HEAD:main
